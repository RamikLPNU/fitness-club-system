<script>
  if (localStorage.getItem("isAdmin") !== "true") {
    window.location.href = "login.html";
  }
</script>

<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Reports | Fitness Club</title>
    <link rel="stylesheet" href="/static/styles/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<header>
    <h1>Fitness Club — Reports</h1>
    <nav>
        <a href="/admin_dashboard">Dashboard</a>
        <a href="/admin_reports">Reports</a>
        <a href="/">Logout</a>
    </nav>
</header>

<main>

    <section>
    <h2>Активність клієнтів</h2>

        

        <ul class="client-list collapsed" id="clientActivityList"></ul>
        <button id="toggleClientActivity" class="toggle-btn">
            Показати весь список
        </button>
    </section>


    <section class="admin-card">
        <h2>Доходи клубу</h2>

        <div class="income-controls">
            <label for="incomeYear">Рік:</label>
            <input type="number" id="incomeYear" value="2025" min="2000" max="2100">
            <button id="loadIncomeBtn" >Показати</button>
        </div>

        <div class="chart-wrapper">
            <canvas id="adminIncomeChart"></canvas>
        </div>
    </section>

    <section class="chart-card">
        <h2>Завантаженість тренерів</h2>

        <div class="chart-controls">
            <label>
                Місяць:
                <input type="number" id="month" min="1" max="12" value="4">
            </label>

            <label>
                Рік:
                <input type="number" id="year" value="2025">
            </label>

            <button id="loadTrainerBtn">Показати</button>
        </div>

        <div class="chart-wrapper">
            <canvas id="adminTrainerChart"></canvas>
        </div>
    </section>

</main>

<script src="/static/js/reports.js"></script>
</body>
</html>
